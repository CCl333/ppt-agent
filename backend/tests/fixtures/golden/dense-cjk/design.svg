  <rect x="64" y="120" width="520" height="160" class="c-surface" fill="#F5F5F5"/>
  <text x="80" y="168" class="t-body" data-node-id="block-1-body" data-text-role="body" data-layout-box="80,140,488,120" font-size="16px" fill="#1F2937">故宫建议午门进神武门出主要殿宇约三小时颐和园占地二百九十七公顷整日游览为宜长城专线建议整天避免与市区景点混排旺季需提前七天实名预约</text>
